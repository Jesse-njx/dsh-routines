name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install the real dsh CLI (for the end-to-end test)
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify the packed tarball
        run: |
          pnpm pack
          tar -tzf dsh-routines-bundle-0.1.0.tgz | grep -q 'package/cordis.patch.yml'
          tar -tzf dsh-routines-bundle-0.1.0.tgz | grep -q 'package/lib/run.js'
          tar -tzf dsh-routines-bundle-0.1.0.tgz | grep -q 'package/README.md'
